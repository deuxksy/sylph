# tag:github-action
name: OpenTofu Plan & Apply

on:
  push:
    branches:
      - main
    paths:
      - 'opentofu/**'
      - '.github/workflows/opentofu.yml'
  pull_request:
    paths:
      - 'opentofu/**'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply 자동 실행 (main 병합 후만 가능)'
        required: false
        default: 'false'

env:
  OPENTOFU_VERSION: '1.12.5'

jobs:
  plan:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    outputs:
      plan-json: ${{ steps.plan.outputs.json }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false

      - name: Initialize OpenTofu
        working-directory: ./opentofu
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: tofu init

      - name: Format check
        working-directory: ./opentofu
        run: tofu fmt -check -recursive

      - name: Validate configuration
        working-directory: ./opentofu
        env:
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TS_API_CLIENT_ID }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TS_API_CLIENT_SECRET }}
          TAILSCALE_TAILNET: ${{ vars.TS_TAILNET_ID }}
        run: tofu validate

      - name: Create plan
        working-directory: ./opentofu
        id: plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TS_API_CLIENT_ID }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TS_API_CLIENT_SECRET }}
          TAILSCALE_TAILNET: ${{ vars.TS_TAILNET_ID }}
          TF_INPUT: false
        run: |
          tofu plan -no-color -json > tfplan.json 2>&1 || true
          tofu plan -no-color > tfplan.txt 2>&1 || true
          {
            echo "json<<EOF"
            cat tfplan.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: opentofu/tfplan.*
          retention-days: 1

      - name: Comment PR with plan
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planText = fs.readFileSync('opentofu/tfplan.txt', 'utf8');
            
            const output = `## 📋 OpenTofu Plan
            \`\`\`
            ${planText}
            \`\`\`
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  apply:
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production  # 수동 승인 게이트 (선택사항)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false

      - name: Initialize OpenTofu
        working-directory: ./opentofu
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: tofu init

      - name: Apply configuration
        working-directory: ./opentofu
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TS_API_CLIENT_ID }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TS_API_CLIENT_SECRET }}
          TAILSCALE_TAILNET: ${{ vars.TS_TAILNET_ID }}
          TF_INPUT: false
        run: tofu apply -auto-approve

      - name: Notify completion
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ OpenTofu apply completed successfully!'
            });

[rpi]
auxo ansible_host=auxo ansible_user=crong

[rpi:vars]
ansible_python_interpreter=/usr/bin/python3

# Tailscale SSH 활성화 대상 — ACL(policy.hujson ssh 섹션) dst에 포함된 태그 + nonroot 사용자 존재 확인된 노드만
[tailscale-ssh]
brla     ansible_host=brla.bun-bull.ts.net     ansible_user=ubuntu
lt       ansible_host=lt.bun-bull.ts.net       ansible_user=ubuntu
mo       ansible_host=mo.bun-bull.ts.net       ansible_user=crong    ansible_python_interpreter=/run/current-system/sw/bin/python3
walle    ansible_host=walle.bun-bull.ts.net    ansible_user=crong

# 대기 중 — 활성화 전제조건 해결 후 [tailscale-ssh]로 이동
# girl: 2026-09-03 사용자가 수동 활성화 완료 — Ansible은 sudo 비밀번호 필요로 수동 관리
# heritage: nonroot가 media뿐(root Ansible 접속 상실) → 사용자 방안 필요
# arv: python3 없음(모듈 실행 불가) + nonroot 사용자 미확인
[tailscale-ssh-pending]
girl     ansible_host=girl.bun-bull.ts.net     ansible_user=deck
heritage ansible_host=heritage.bun-bull.ts.net ansible_user=root
arv      ansible_host=arv.bun-bull.ts.net      ansible_user=root

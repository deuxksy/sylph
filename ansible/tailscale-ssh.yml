# Tailscale SSH 서버 활성화: 각 노드의 tailscaled에서 인바운드 SSH 서버 켜기
# 주의:
# - 활성화 즉시 tailnet 경로 port 22 트래픽이 tailscaled로 가로채진다 (기존 sshd 우회).
# - tailnet ACL(policy.hujson ssh 섹션)의 dst/users가 해당 호스트를 허용해야 한다.
# - 활성화 시 현재 SSH 세션이 끊길 수 있어 failed_when: false + 별도 play에서 재검증.
# 사용: ansible-playbook -i ansible/inventory.ini ansible/tailscale-ssh.yml

- name: Tailscale SSH 서버 활성화
  hosts: tailscale-ssh
  become: true
  gather_facts: false
  # 활성화로 SSH 세션이 끊기며 unreachable 처리되어도 다음 play(검증)가 실행되도록
  ignore_unreachable: true

  tasks:
    - name: 현재 RunSSH 설정 조회
      ansible.builtin.command: tailscale debug prefs
      register: ts_prefs
      changed_when: false

    - name: Tailscale SSH 서버 활성화 (꺼져 있을 때만)
      # accept-risk: tailnet SSH 세션 재라우팅으로 연결 끊김 승인
      ansible.builtin.command: tailscale set --ssh --accept-risk=lose-ssh
      when: ts_prefs.stdout is not search('"RunSSH":\s*true')
      register: ts_set
      changed_when: ts_prefs.stdout is not search('"RunSSH":\s*true')
      failed_when: false  # 세션 끊김으로 응답을 못 받을 수 있음

- name: 활성화 검증 (새 연결)
  hosts: tailscale-ssh
  gather_facts: false

  tasks:
    - name: 오래된 sshd host key 제거 (tailscaled host key로 교체됨)
      ansible.builtin.command: ssh-keygen -R {{ ansible_host }}
      delegate_to: localhost
      changed_when: false
      failed_when: false

    - name: RunSSH 재조회
      ansible.builtin.command: tailscale debug prefs
      become: true
      register: ts_prefs_after
      changed_when: false

    - name: RunSSH=true 검증
      ansible.builtin.assert:
        that: ts_prefs_after.stdout is search('"RunSSH":\s*true')
        fail_msg: "RunSSH 활성화 실패"
